name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build userscript
        run: npm run build

      - name: Verify release notes against PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/extract-changelog.mjs "$version" "$RUNNER_TEMP/release.md"
          gh pr view "$PR_NUMBER" --json body > "$RUNNER_TEMP/pr.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/pr.json'))
          const expected = readFileSync(process.env.RUNNER_TEMP + '/release.md', 'utf8')
          if (pr.body?.replaceAll('\r\n', '\n') !== expected) throw new Error('Merged PR body differs from changelog')
          NODE

      - name: Inspect tag, release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        id: check
        run: node scripts/check-release.mjs inspect "$MERGE_SHA" "$RUNNER_TEMP/release.md"

      - name: Create tag at merge commit
        if: steps.check.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: git push origin "$MERGE_SHA:refs/tags/$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.state == 'create'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          body_path: ${{ runner.temp }}/release.md
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/bilibili-live-tasks-helper.user.js
            dist/bilibili-live-tasks-helper.min.user.js
            dist/bilibili-live-tasks-helper.meta.js

      - name: Resume incomplete release
        if: steps.check.outputs.state == 'repair' || steps.check.outputs.state == 'draft'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          MISSING: ${{ steps.check.outputs.missing }}
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
        run: |
          for file in $MISSING; do
            gh release upload "$TAG" "$file"
          done
          if [[ "$STATE" == draft ]]; then
            gh release edit "$TAG" --draft=false
          fi

      - name: Verify release tag, notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs verify "$MERGE_SHA" "$RUNNER_TEMP/release.md"
