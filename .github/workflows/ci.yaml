name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: BLTH build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
